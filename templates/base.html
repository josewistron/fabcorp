<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fabcorp | MFTE Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary2: #4f8cff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f6f8fc;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 20px;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .menu a {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--muted);
            transition: .2s;
            font-size: 14px;
        }

        .menu a:hover {
            background: #eef4ff;
            color: var(--primary);
        }

        .menu a.active {
            background: #eef4ff;
            color: var(--primary);
            font-weight: 600;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .logout {
            text-decoration: none;
            font-size: 13px;
            color: #ef4444;
            font-weight: 500;
        }

        .logout:hover {
            text-decoration: underline;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
        }

        /* optional card style for pages */
        .card-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">FABCORP</div>

        <div class="menu">

            <a href="/index">
                <i data-lucide="home" width="18"></i> Home
            </a>

            <a href="/rack-monitor">
                <i data-lucide="cpu" width="18"></i> Rack Monitor
            </a>

            <a href="/wip/failures">
                <i data-lucide="alert-triangle" width="18"></i> Failures Report
            </a>

            <a href="/wip/fail-units">
                <i data-lucide="x-circle" width="18"></i> Fail Units
            </a>

            <a href="/wip/wip">
                <i data-lucide="layers" width="18"></i> WIP
            </a>

            <a href="/users">
    <i data-lucide="users" width="18"></i> Users
</a>

        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <div class="topbar">

            <div><b style="color: var(--primary);">MFTE SYSTEM</b></div>

            <div class="user">

                <span>{{ session.get('user_name') }}</span>

                <a class="logout" href="/logout">Logout</a>

            </div>

        </div>

        <!-- CONTENT -->
        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
