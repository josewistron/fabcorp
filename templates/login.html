<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabcorp | MFTE Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary2: #4f8cff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f6f8fc;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            overflow: hidden;
            color: var(--text);
        }

        .layout {
            position: fixed;
            inset: 0;
            display: flex;
        }

        /* LEFT */
        .left {
            width: 55%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px;
            background:
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.10), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(79, 140, 255, 0.08), transparent 45%),
                linear-gradient(180deg, #ffffff, #f4f7ff);
        }

        .left-card {
            max-width: 520px;
        }

        .left h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -1px;
        }

        .left p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .badge {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            background: #eef4ff;
            border: 1px solid #dbe6ff;
            font-size: 11px;
            color: var(--primary);
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* RIGHT */
        .right {
            width: 45%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        /* CARD */
        .card {
            width: 100%;
            max-width: 440px;
            padding: 42px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
        }

        .brand span {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 3px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .input {
            position: relative;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fafbff;
            color: var(--text);
            padding-left: 44px;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: #fff;
        }

        .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }

        button {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: white;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
        }

        .status {
            margin-top: 18px;
            font-size: 11px;
            color: var(--muted);
            text-align: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media(max-width: 900px) {
            .left { display: none; }
            .right { width: 100%; }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- LEFT -->
    <div class="left">
        <div class="left-card">

            <div class="badge">
                <i data-lucide="cpu" width="24"></i>
            </div>

            <h1>Fabcorp MFTE Portal</h1>

            

        </div>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="card">

            <div class="brand">
                <h2>FABCORP</h2>
                <span>MFTE PORTAL</span>
            </div>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div style="margin-bottom:15px; padding:10px; border-radius:10px; background:#fee2e2; color:#991b1b;">
        {{ messages[0] }}
    </div>
  {% endif %}
{% endwith %}
            <form action="/login" method="POST">

                <div class="input">
                    <label>User ID</label>
                    <i data-lucide="user" class="icon" width="18"></i>
                    <input name="username" type="text" placeholder="employee.id" required>
                </div>

                <div class="input">
                    <label>Password</label>
                    <i data-lucide="lock" class="icon" width="18"></i>
                    <input name="password" type="password" placeholder="••••••••" required>
                </div>

                <button type="submit">
                    Sign In
                </button>

            </form>

            <div class="status">
                <span class="dot"></span>
                Secure system • Encrypted session active
            </div>

        </div>

    </div>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
