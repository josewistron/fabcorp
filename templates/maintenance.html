{% extends "base.html" %}
{% block content %}

<div class="container-fluid d-flex justify-content-center align-items-center"
     style="height:80vh; background:#f0f2f5;">

   <div class="text-center">

      <div style="font-size:60px; margin-bottom:10px;">
         🛠️
      </div>

      <h3 class="fw-bold text-primary">
   Working on {{ module|default("this module") }}
</h3>

      <p class="text-muted mb-4">
         This section is under maintenance or still in development.
      </p>

      <div class="card shadow-sm" style="max-width:400px; margin:auto;">
         <div class="card-body">

            <div class="progress mb-3" style="height:8px;">
               <div class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width:65%;">
               </div>
            </div>

            <small class="text-muted">
               Please check back later.
            </small>

         </div>
      </div>

   </div>

</div>

{% endblock %}
