{% extends "base.html" %}
{% block content %}

<h2>Dashboard Home</h2>
<p>Welcome to MFTE system</p>

<div id="dashboard-loader" class="card shadow-sm p-3 mb-3" style="border-radius:12px;">
   <div class="d-flex align-items-center">
      <div class="spinner-border text-primary"></div>
      <span class="ms-2">Loading dashboard...</span>
   </div>
</div>

<div id="dashboard-content" style="display:none;">

   <div class="row g-3 align-items-stretch">

      <div class="col-md-6 col-lg-4 d-flex">
         <div class="card shadow-sm w-100 h-100"   
              style="border-radius:12px; border:1px solid #e5e7eb; background:#ffffff;">

            <div class="card-body d-flex flex-column" style="padding:12px;">

               <a target="_blank" href="/rack-monitor">
                  <h6 class="fw-bold">
                     <i data-lucide="server"></i>
                     Rack Overview
                  </h6>
               </a>

               <div class="row g-2" id="rack-container"></div>

            </div>
         </div>
      </div>

      <div class="col-md-6 col-lg-4 d-flex">
         <div class="card shadow-sm w-100 h-100"
              style="border-radius:12px; border:1px solid #e5e7eb; background:#ffffff;">

            <div class="card-body d-flex flex-column justify-content-between" style="padding:12px;">

               <a target="_blank" href="/failures">
                  <h6 class="fw-bold mb-2">
                     <i data-lucide="alert-triangle"></i>
                     Failures
                  </h6>
               </a>

               <div class="row g-2 h-100">
                  
                  <div class="col-6">
                     <div id="top-error" style="
                        display:flex;
                        flex-direction:column;
                        justify-content:center;
                        align-items:center;
                        padding:10px;
                        border-radius:6px;
                        background:#fee2e2;
                        color:#991b1b;
                        font-size:12px;
                        font-weight:600;
                        text-align:center;
                        height:100%;
                     ">
                        Loading...
                     </div>
                  </div>

                  <div class="col-6">
                     <div id="others" style="
                        display:flex;
                        flex-direction:column;
                        justify-content:center;
                        align-items:center;
                        padding:10px;
                        border-radius:6px;
                        background:#f3f4f6;
                        color:#111827;
                        font-size:12px;
                        font-weight:600;
                        height:100%;
                     ">
                        Loading...
                     </div>
                  </div>

               </div>

            </div>
         </div>
      </div>

   </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

   const loader = document.getElementById("dashboard-loader");
   const content = document.getElementById("dashboard-content");

   try {

      const res = await fetch("/api/dashboard");
      const data = await res.json();

      // RACK
      const rack = document.getElementById("rack-container");
      rack.innerHTML = Object.entries(data.configs || {}).map(([k,v]) => `
         <div class="col-6">
            <div style="
               display:flex;
               justify-content:space-between;
               padding:5px 8px;
               border-radius:6px;
               background:${v==0?'#e5e7eb':'#0d6efd'};
               color:${v==0?'#374151':'#fff'};
               font-size:10px;
               font-weight:600;
            ">
               <span>${k}</span>
               <span>${v}</span>
            </div>
         </div>
      `).join("");

      // FAILURES
      document.getElementById("top-error").innerHTML =
         `<div style="font-size:11px;">Most Common</div>
          <div style="font-size:11px; margin-top:4px;">${data.top_error_name.substring(0, 18)}</div>
          <div style="font-size:16px; margin-top:6px;">${data.top_error_count}</div>`;

      document.getElementById("others").innerHTML =
         `<div>Others</div><div style="font-size:16px;">${data.total_others}</div>`;

   } catch (e) {
      console.error(e);
      document.getElementById("top-error").innerHTML = "Error loading";
      document.getElementById("others").innerHTML = "Error loading";
   }

   loader.style.display = "none";
   content.style.display = "block";

   lucide.createIcons();

});
</script>

{% endblock %}
